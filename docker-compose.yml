services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tictactoe-backend
    environment:
      PORT: "9000"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
    expose:
      - "9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: tictactoe-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    restart: unless-stopped
